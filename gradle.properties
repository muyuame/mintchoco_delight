# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 环境版本：Minecraft 1.20.1 / Forge 47.x
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47,)
loader_version_range=[47,)

# Mappings（官方映射）
mapping_channel=official
mapping_version=1.20.1

# Farmer's Delight（硬依赖，jar 放在 libs/ 目录）
farmersdelight_version=1.20.1-1.3.4

## Mod Properties

# Mod 唯一标识符，必须与主类 @Mod 常量、META-INF/mods.toml 的 modId 一致
mod_id=mintchoco_delight
# 显示名称
mod_name=Mint Choco Delight
# 许可
mod_license=MIT License
# 版本
mod_version=1.0.1
# 包名基（与 mod_group_id 保持一致）
mod_group_id=com.mintchoco.delight
# 作者
mod_authors=MuYu_Ame
# 描述
mod_description=Farmers Delight: Mint Choco Delight. An addon adding mint crops, mint syrup and mint chocolate treats.
