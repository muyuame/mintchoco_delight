# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment：为 Minecraft 方法参数提供可读名称
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# 环境版本
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
neo_version=21.1.252
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Create 及其依赖的版本（来源：https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1）
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# 附属模组（jar 放在 libs/ 目录）
farmersdelight_version=1.21.1-1.3.4
createaddition_version=1.7.2

## Mod Properties

# Mod 唯一标识符，必须与主类 @Mod 常量、neoforge.mods.toml 的 modId 一致
mod_id=mintchoco_delight
# 显示名称
mod_name=Mint Choco Delight
# 许可
mod_license=MIT License
# 版本
mod_version=1.0.0
# 包名基（与 mod_group_id 保持一致）
mod_group_id=com.mintchoco.delight
# 作者
mod_authors=MuYu_Ame
# 描述
mod_description=Farmers Delight: Mint Choco Delight. An addon adding mint crops, mint syrup and mint chocolate treats, with Create automation support.